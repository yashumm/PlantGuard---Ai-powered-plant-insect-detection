<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🌿 PlantGuard – Insect Detection</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f4c2a 0%, #1d8a4e 50%, #5ecf8a 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
      color: white;
    }
    header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
    header p  { font-size: 1rem; opacity: 0.85; margin-top: 6px; }

    .card {
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 500px;
      padding: 36px 32px;
    }

    /* Upload zone */
    .upload-zone {
      border: 2.5px dashed #1d8a4e;
      border-radius: 16px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      position: relative;
    }
    .upload-zone:hover, .upload-zone.dragover { background: #f0faf4; border-color: #0f6b37; }
    .upload-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .upload-zone .icon { font-size: 2.4rem; margin-bottom: 8px; }
    .upload-zone p { color: #555; font-size: 0.95rem; }
    .upload-zone .hint { color: #aaa; font-size: 0.8rem; margin-top: 4px; }

    /* Preview */
    #preview-wrap {
      display: none;
      margin-top: 18px;
      text-align: center;
    }
    #preview-wrap img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      object-fit: cover;
    }
    #preview-wrap .file-name {
      font-size: 0.8rem;
      color: #888;
      margin-top: 6px;
    }

    /* Button */
    button#predictBtn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: linear-gradient(135deg, #1d8a4e, #12b05c);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    button#predictBtn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    button#predictBtn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Loader */
    .spinner {
      display: none;
      margin: 22px auto 0;
      width: 38px; height: 38px;
      border: 4px solid #d4f0e2;
      border-top-color: #1d8a4e;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result card */
    #result-card {
      display: none;
      margin-top: 22px;
      border-radius: 16px;
      overflow: hidden;
      border: 1.5px solid #e2e8f0;
    }

    .result-header {
      padding: 18px 20px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .result-header .emoji { font-size: 2.2rem; }
    .result-header .label { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.7; }
    .result-header .name { font-size: 1.5rem; font-weight: 700; text-transform: capitalize; margin-top: 2px; }
    .result-header .confidence { font-size: 0.9rem; margin-top: 4px; opacity: 0.8; }

    /* severity colors */
    .sev-None   { background: #e6faf0; color: #0d6e3c; }
    .sev-Medium { background: #fff8e1; color: #7a5400; }
    .sev-High   { background: #fdecea; color: #8b1a1a; }

    .result-desc {
      padding: 12px 20px;
      background: #f9f9f9;
      border-top: 1px solid #eee;
      font-size: 0.9rem;
      color: #444;
      line-height: 1.5;
    }

    /* Probability bars */
    .prob-section { padding: 14px 20px 16px; background: white; border-top: 1px solid #eee; }
    .prob-section h4 { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #888; margin-bottom: 10px; }
    .prob-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .prob-label { font-size: 0.83rem; width: 90px; text-transform: capitalize; color: #444; }
    .bar-track { flex: 1; height: 8px; background: #eef; border-radius: 99px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 99px; background: #1d8a4e; transition: width 0.6s ease; }
    .prob-pct  { font-size: 0.8rem; color: #666; width: 42px; text-align: right; }

    /* Error */
    #error-box {
      display: none;
      margin-top: 18px;
      background: #fdecea;
      color: #8b1a1a;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.9rem;
    }

    /* API config note */
    .api-note {
      font-size: 0.75rem;
      color: #aaa;
      text-align: center;
      margin-top: 14px;
    }
    .api-note span { font-weight: 600; color: #1d8a4e; }
  </style>
</head>
<body>

<header>
  <h1>🌿 PlantGuard</h1>
  <p>AI-powered plant insect detection</p>
</header>

<div class="card">

  <div class="upload-zone" id="uploadZone">
    <input type="file" id="imageInput" accept="image/*" />
    <div class="icon">📷</div>
    <p>Click or drag & drop a plant image</p>
    <p class="hint">Supports JPG, PNG, WEBP</p>
  </div>

  <div id="preview-wrap">
    <img id="previewImg" src="" alt="Preview" />
    <div class="file-name" id="fileName"></div>
  </div>

  <button id="predictBtn" onclick="predict()" disabled>Detect Insect</button>

  <div class="spinner" id="spinner"></div>
  <div id="error-box"></div>
  <div id="result-card"></div>

  <p class="api-note">Backend at <span id="apiUrlDisplay">http://127.0.0.1:8080</span></p>
</div>

<script>
  // ── CONFIG ──────────────────────────────────────────
  const API_URL = "http://127.0.0.1:8080";
  document.getElementById("apiUrlDisplay").textContent = API_URL;

  // ── Drag & Drop ──────────────────────────────────────
  const zone = document.getElementById("uploadZone");
  zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("dragover"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
  zone.addEventListener("drop", e => {
    e.preventDefault();
    zone.classList.remove("dragover");
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  document.getElementById("imageInput").addEventListener("change", e => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  });

  function handleFile(file) {
    document.getElementById("previewImg").src = URL.createObjectURL(file);
    document.getElementById("fileName").textContent = file.name;
    document.getElementById("preview-wrap").style.display = "block";
    document.getElementById("predictBtn").disabled = false;
    document.getElementById("result-card").style.display = "none";
    document.getElementById("error-box").style.display = "none";
  }

  // ── Predict ──────────────────────────────────────────
  async function predict() {
    const file = document.getElementById("imageInput").files[0];
    if (!file) { showError("Please select an image first."); return; }

    setLoading(true);
    document.getElementById("result-card").style.display = "none";
    document.getElementById("error-box").style.display = "none";

    try {
      const formData = new FormData();
      formData.append("file", file);

      const response = await fetch(`${API_URL}/predict`, {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.detail || "Server error");
      }

      const data = await response.json();
      showResult(data);
    } catch (e) {
      showError("Could not reach the backend. Make sure it is running on " + API_URL + ".<br><br><strong>Error:</strong> " + e.message);
    } finally {
      setLoading(false);
    }
  }

  function showResult(data) {
    const sev = data.info?.severity || "None";
    const card = document.getElementById("result-card");

    let barsHtml = "";
    if (data.all_probabilities) {
      barsHtml = `
        <div class="prob-section">
          <h4>All Class Probabilities</h4>
          ${Object.entries(data.all_probabilities).map(([cls, pct]) => `
            <div class="prob-row">
              <span class="prob-label">${cls}</span>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
              <span class="prob-pct">${pct}%</span>
            </div>`).join("")}
        </div>`;
    }

    card.innerHTML = `
      <div class="result-header sev-${sev}">
        <div class="emoji">${data.info?.emoji || "🌿"}</div>
        <div>
          <div class="label">Detected</div>
          <div class="name">${data.prediction}</div>
          <div class="confidence">Confidence: <strong>${data.confidence}%</strong> · Severity: ${sev}</div>
        </div>
      </div>
      <div class="result-desc">${data.info?.description || ""}</div>
      ${barsHtml}
    `;
    card.style.display = "block";
  }

  function showError(msg) {
    const box = document.getElementById("error-box");
    box.innerHTML = "⚠️ " + msg;
    box.style.display = "block";
  }

  function setLoading(on) {
    document.getElementById("spinner").style.display = on ? "block" : "none";
    document.getElementById("predictBtn").disabled = on;
  }
</script>
</body>
</html>
